{% extends 'parking/base.html' %}

{% block title %}Detección en Tiempo Real - MoveTracker{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Detección en Tiempo Real</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <div class="input-group">
                <label class="input-group-text" for="cameraSelect"><i class="bi bi-camera-video-fill"></i></label>
                <select class="form-select" id="cameraSelect">
                    <option value="0" selected>Cámara 0</option>
                    <option value="1">Cámara 1</option>
                    <option value="2">Cámara 2</option>
                    <option value="3">Cámara 3</option>
                </select>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 text-center">
            <div class="card">
                <div class="card-body">
                    <img id="cameraFeed" src="{% url 'live_feed' %}" class="img-fluid" style="max-height: 720px;" alt="Live Camera Feed" />
                    <div class="mt-3">
                        <h4>Placa Detectada: <span id="detected-plate" class="badge bg-success">Esperando...</span></h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var currentCameraIndex = 0;

    document.getElementById('cameraSelect').addEventListener('change', function() {
        var cameraIndex = this.value;
        currentCameraIndex = cameraIndex;
        var img = document.getElementById('cameraFeed');
        // Stop current feed by clearing src temporarily (optional, but helps visual feedback)
        img.src = "";
        // Add timestamp to prevent caching
        setTimeout(function() {
            img.src = "{% url 'live_feed' %}?camera_index=" + cameraIndex + "&t=" + new Date().getTime();
        }, 100);
    });

    setInterval(function() {
        fetch("{% url 'get_latest_plate' %}?detection_id=live_" + currentCameraIndex)
        .then(response => response.json())
        .then(data => {
            if (data.plate) {
                document.getElementById('detected-plate').innerText = data.plate;
            }
        });
    }, 1000);
</script>
{% endblock %}
