{% extends 'parking/base.html' %}

{% block title %}Detección en Tiempo Real - MoveTracker{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Detección en Tiempo Real</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <div class="input-group">
                <label class="input-group-text" for="cameraSelect"><i class="bi bi-camera-video-fill"></i></label>
                <select class="form-select" id="cameraSelect">
                    <option value="0" selected>Cámara 0</option>
                    <option value="1">Cámara 1</option>
                    <option value="2">Cámara 2</option>
                    <option value="3">Cámara 3</option>
                </select>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 text-center">
            <div class="card">
                <div class="card-body">
                    <img id="cameraFeed" src="{% url 'live_feed' %}" class="img-fluid" style="max-height: 720px;" alt="Live Camera Feed" />
                    <div class="mt-3">
                        <h5>Historial de Detecciones</h5>
                        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark" style="position: sticky; top: 0;">
                                    <tr>
                                        <th>Vehículo</th>
                                        <th>Placa</th>
                                        <th>Confianza</th>
                                    </tr>
                                </thead>
                                <tbody id="detection-history-body">
                                    <!-- Rows will be added here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var currentCameraIndex = 0;

    document.getElementById('cameraSelect').addEventListener('change', function() {
        var cameraIndex = this.value;
        currentCameraIndex = cameraIndex;
        var img = document.getElementById('cameraFeed');
        img.src = "";
        setTimeout(function() {
            img.src = "{% url 'live_feed' %}?camera_index=" + cameraIndex + "&t=" + new Date().getTime();
        }, 100);
    });

    setInterval(function() {
        fetch("{% url 'get_latest_plate' %}?detection_id=live_" + currentCameraIndex)
        .then(response => response.json())
        .then(data => {
            // Actualizar historial
            if (data.history && data.history.length > 0) {
                var tbody = document.getElementById('detection-history-body');
                tbody.innerHTML = ""; 
                // Mostrar mas recientes primero
                data.history.slice().reverse().forEach(function(item) {
                    var row = `<tr>
                        <td>${item.vehicle_type}</td>
                        <td>${item.plate}</td>
                        <td>${(item.confidence * 100).toFixed(1)}%</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            }
        });
    }, 1000);
</script>
{% endblock %}
